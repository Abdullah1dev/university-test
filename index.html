<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 40px;
        }

        .profile {
            background-color: white;
            max-width: 900px;
            margin: auto;
            padding: 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 30px;

            flex-wrap: wrap;
        }

        .profile img {
            width: 250px;
            height: 250px;
            object-fit: cover;
            border-radius: 50%;
        }

        .profile-info {
            flex: 1;
        }

        .profile-info h1 {
            margin-bottom: 10px;
        }

        .profile-info h3 {
            color: #555;
        }

        .skills {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .skill {
            background-color: #222;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
        }

        @media (max-width: 600px) {

            .profile {
                flex-direction: column;
                text-align: center;
            }

            .profile img {
                width: 180px;
                height: 180px;
            }

            .skills {
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <div class="profile">

        <img src="student.jpg" alt="Student Image">

        <div class="profile-info">

            <h1>Abdullah Tahir</h1>

            <h3>BS Software Engineering</h3>

            <p>
                I am a passionate software engineering student interested
                in web development, Python and artificial intelligence.
            </p>

            <h3>Skills</h3>

            <div class="skills">
                <div class="skill">Python</div>
                <div class="skill">HTML/CSS</div>
                <div class="skill">Django</div>
            </div>

        </div>

    </div>

</body>
</html>
