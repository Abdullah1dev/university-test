<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Academic & Scholarship Management</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Student Academic & Scholarship Management</h1>

    <!-- Student Academic Profile -->
    <section id="studentProfile">

        <h2>Student Academic Profile</h2>

        <p><strong>Name:</strong> <span id="studentName"></span></p>

        <p><strong>Registration No:</strong> <span id="registrationNumber"></span></p>

        <p><strong>Program:</strong> <span id="program"></span></p>

        <p><strong>Semester:</strong> <span id="semester"></span></p>

        <p><strong>CGPA:</strong> <span id="cgpa"></span></p>

        <p><strong>Attendance:</strong> <span id="attendance"></span>%</p>

    </section>

    <script src="script.js"></script>

</body>
</html>
